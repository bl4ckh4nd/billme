name: Publish GHCR Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'apps/server-api/**'
      - 'apps/server-worker/**'
      - 'apps/web/**'
      - 'apps/web-pro/**'
      - 'packages/**'
      - 'docker/**'
      - 'docker-compose.server-mode.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/publish-ghcr.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: server-api
            dockerfile: apps/server-api/Dockerfile
          - service: server-worker
            dockerfile: apps/server-worker/Dockerfile
          - service: web
            dockerfile: apps/web/Dockerfile
          - service: web-pro
            dockerfile: apps/web-pro/Dockerfile

    env:
      REGISTRY_IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY_IMAGE_PREFIX}/${{ matrix.service }}"
          {
            echo "tags<<EOF"
            echo "${image}:sha-${GITHUB_SHA}"
            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              echo "${image}:latest"
            fi
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "${image}:${GITHUB_REF_NAME}"
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
