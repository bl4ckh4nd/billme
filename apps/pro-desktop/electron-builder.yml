appId: com.billme.pro
productName: Billme Pro
electronVersion: 37.10.3

publish:
  provider: github
  owner: bl4ckh4nd
  repo: billme

directories:
  output: release

icon: build/icons/icon.png

files:
  - dist/**
  - package.json
extraResources:
  - from: ../../doppelteBuchhaltung
    to: doppelteBuchhaltung
    filter:
      - skr-kontenrahmen.sqlite

asar: true
asarUnpack:
  - node_modules/**/*.node
  - node_modules/better-sqlite3/**
  - node_modules/keytar/**

win:
  icon: build/icons/icon.ico
  target:
    - nsis

mac:
  icon: build/icons/icon.png
  target:
    - dmg
    - zip

linux:
  icon: build/icons
  category: Utility
  maintainer: Billme Team <opensource@billme.app>
  target:
    - AppImage
    - deb

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
