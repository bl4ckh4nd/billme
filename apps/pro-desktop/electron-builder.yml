appId: com.billme.pro
productName: Billme Pro

# Lite and Pro publish into the same GitHub release. Without a distinct channel
# both would emit `latest*.yml`, one would overwrite the other, and the Lite
# updater could hand a user the Pro build (which uses a different database).
# Pro therefore ships `pro*.yml`; Lite keeps the default `latest*.yml`.
publish:
  provider: github
  owner: bl4ckh4nd
  repo: billme
  channel: pro

directories:
  output: release

icon: build/icons/icon.png

files:
  - dist/**
  - package.json
extraResources:
  - from: ../../doppelteBuchhaltung
    to: doppelteBuchhaltung
    filter:
      - skr-kontenrahmen.sqlite

asar: true
asarUnpack:
  - node_modules/**/*.node
  - node_modules/better-sqlite3/**
  - node_modules/keytar/**

win:
  icon: build/icons/icon.ico
  target:
    - nsis

mac:
  icon: build/icons/icon.png
  target:
    - dmg
    - zip

linux:
  icon: build/icons
  category: Utility
  maintainer: Billme Team <opensource@billme.app>
  target:
    - AppImage
    - deb

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
