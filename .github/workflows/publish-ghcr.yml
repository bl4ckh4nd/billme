name: Publish GHCR Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/server-api/**"
      - "apps/server-worker/**"
      - "apps/offer-portal/**"
      - "apps/web/**"
      - "apps/web-pro/**"
      - "packages/**"
      - "docker/**"
      - "docker-compose.server-mode.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/publish-ghcr.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: server-api
            dockerfile: apps/server-api/Dockerfile
          - service: offer-portal
            dockerfile: apps/offer-portal/Dockerfile
          - service: web
            dockerfile: apps/web/Dockerfile
          - service: web-pro
            dockerfile: apps/web-pro/Dockerfile

    env:
      REGISTRY_IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
      PUBLIC_API_URL: ${{ vars.BILLME_PUBLIC_API_URL || 'http://localhost:3100' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY_IMAGE_PREFIX}/${{ matrix.service }}"
          {
            echo "tags<<EOF"
            echo "${image}:sha-${GITHUB_SHA}"
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_REF}" == "refs/heads/main" ]]; then
              echo "${image}:latest"
            fi
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "${image}:${GITHUB_REF_NAME}"
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute build arguments
        id: build-args
        shell: bash
        run: |
          if [[ "${{ matrix.service }}" == "web" || "${{ matrix.service }}" == "web-pro" ]]; then
            echo "value=VITE_SERVER_API_URL=${PUBLIC_API_URL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ steps.build-args.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  publish-server-worker-architecture:
    name: Publish server-worker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    env:
      REGISTRY_IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server-worker (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server-worker/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.REGISTRY_IMAGE_PREFIX }}/server-worker:sha-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=server-worker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-worker-${{ matrix.arch }}

  publish-server-worker-manifest:
    name: Publish server-worker manifest
    runs-on: ubuntu-latest
    needs: publish-server-worker-architecture
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/server-worker
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture manifest
        shell: bash
        run: |
          set -euo pipefail
          sources=(
            "${REGISTRY_IMAGE}:sha-${GITHUB_SHA}-amd64"
            "${REGISTRY_IMAGE}:sha-${GITHUB_SHA}-arm64"
          )
          tags=(--tag "${REGISTRY_IMAGE}:sha-${GITHUB_SHA}")
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags+=(--tag "${REGISTRY_IMAGE}:latest")
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags+=(--tag "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}" --tag "${REGISTRY_IMAGE}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
